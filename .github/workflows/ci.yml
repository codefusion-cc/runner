name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  check:
    name: Format, lint, tests and release build (Apple silicon)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      # The guest image first: the kernel and initramfs are embedded into the crates that follow, signed with a key
      # made for this run.
      - name: Guest image
        run: cargo xtask guest
      - run: cargo clippy --locked --workspace --all-targets -j3 -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace -j3
        env:
          CF_REQUIRE_EMBEDDED: '1'
      - name: Release build, ad hoc signed with the virtualization entitlement
        run: cargo xtask build
      - name: The binary starts and carries the entitlement
        run: |
          set -euo pipefail
          target/release/codefusion-runner version
          entitlements="$(codesign -d --entitlements - target/release/codefusion-runner 2>&1)"
          grep -q com.apple.security.virtualization <<< "$entitlements"
          # The bundle is signed with a key made for this build, so the committed key must refuse it, and
          # for its signature, not for some other reason.
          if refusal="$(target/release/codefusion-runner image verify target/guest --version "$(jq -r .version target/guest/image.json)" 2>&1)"; then
            echo "a bundle signed with another key passed the committed key"
            exit 1
          fi
          grep -q "signature of SHA256SUMS is not valid" <<< "$refusal" || { echo "refused for another reason: $refusal"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codefusion-runner-aarch64-apple-darwin
          path: target/release/codefusion-runner
          retention-days: 7

  linux:
    name: Linux (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64
            runner: ubuntu-24.04-arm
            guest: aarch64-unknown-linux-musl
          - platform: x86_64
            runner: ubuntu-24.04
            guest: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # The crates that build and pass on Linux. Add a crate here once it does.
      LINUX_CRATES: -p cf-budget -p cf-clock -p cf-console-client -p cf-daemon -p cf-fake-console -p cf-fake-github -p cf-ghapp -p cf-guest-proto -p cf-harness -p cf-host-linux -p cf-image -p cf-lifecycle -p cf-netlink -p cf-nft -p cf-scaleset -p cf-secret -p cf-supervisor -p cf-trusted -p cf-vmhost -p cf-vmm -p cf-vmm-ch -p cf-vmm-oci -p cf-workflows -p codefusion-runner -p xtask
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Ubuntu 24.04 holds unprivileged user namespaces to what AppArmor allows a program, and this runner image has
      # it on: cf-nft's kernel tests then cannot even map their user ("Permission denied" on uid_map). Lift that, for
      # this VM only.
      - name: Unprivileged user namespaces
        run: |
          restricted="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
          echo "kernel.apparmor_restrict_unprivileged_userns: $restricted"
          if [ "$restricted" = 1 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # pasta, as a Linux host runs machines with it, for cf-vmm-ch's isolation tests (`ip` and `unshare` are there), and
      # OpenSSL's headers, which the service's HTTPS client builds against on Linux.
      # A mirror that stops answering once held a job here for its whole 30 minutes: each request gives up after 30 s
      # and is asked again, and the step after 5 minutes.
      - name: pasta and OpenSSL's headers
        timeout-minutes: 5
        run: |
          apt=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt[@]}" update -qq
          sudo apt-get "${apt[@]}" install -y -qq --no-install-recommends passt pkg-config libssl-dev
      - run: cargo clippy --locked $LINUX_CRATES --all-targets -j4 -- -D warnings
      # The guest's Linux code for its own target: musl's libc types are not glibc's, so the line above does not stand
      # in for this.
      - name: Lint the guest supervisor for its own target
        run: cargo clippy --locked -p cf-supervisor -p cf-nft --target ${{ matrix.guest }} --bins --lib -j4 -- -D warnings
      # The test run's agent runs in the guest's Linux on the image's Node 24: its tests start real bash suites against
      # a fake console and check that what they stop is gone, process groups and all.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: The test run's agent
        run: node --test crates/daemon/src/test_run/agent.test.mjs
      - name: Tests
        run: cargo test --locked $LINUX_CRATES -j4
        env:
          # A kernel test that cannot make its namespace fails here instead of passing as skipped.
          CF_REQUIRE_NAMESPACES: '1'
      - name: The probe reads this host
        run: cargo run --locked -p cf-host-linux --example linux-probe
      # Container mode against this runner's own Docker: a job cannot read a host file or reach the engine's socket, is
      # stopped at its memory and its deadline, two at once do not see each other, and what a killed vm-host leaves is
      # removed. The runner is thrown away after, so its rootful engine is taken (CF_ENGINE_ROOTFUL); a host never is.
      - name: Container mode against a real engine
        timeout-minutes: 10
        env:
          CF_ENGINE_SOCKET: /var/run/docker.sock
          CF_GUEST_IMAGE: it-ci
          CF_ENGINE_ROOTFUL: '1'
        run: |
          cargo build --locked -p cf-supervisor --bin supervisor --target ${{ matrix.guest }} -j4
          export CF_SUPERVISOR="$PWD/target/${{ matrix.guest }}/debug/supervisor"
          docker build -q -t "codefusion-runner-guest:$CF_GUEST_IMAGE" crates/vmm-oci/tests/image
          cargo test --locked -p cf-vmm-oci --test engine -j4 -- --ignored --test-threads=2
      # The same against the engine a container host runs (scripts/host-setup.sh --sandbox container): this user's
      # rootless Podman, its socket opened by the user's systemd.
      - name: Container mode against rootless Podman
        timeout-minutes: 10
        env:
          CF_GUEST_IMAGE: it-ci
        run: |
          command -v podman >/dev/null ||
            { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends podman uidmap slirp4netns; }
          podman --version
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 1 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          systemctl --user start podman.socket
          export CF_ENGINE_SOCKET="$XDG_RUNTIME_DIR/podman/podman.sock"
          export CF_SUPERVISOR="$PWD/target/${{ matrix.guest }}/debug/supervisor"
          podman build -q -t "codefusion-runner-guest:$CF_GUEST_IMAGE" crates/vmm-oci/tests/image
          cargo test --locked -p cf-vmm-oci --test engine -j4 -- --ignored --test-threads=2

  fresh-host:
    # A fresh Ubuntu host set up the way a cloud VM is (scripts/host-setup.sh as root: a connect code, no App key),
    # against the fake GitHub and console (`cargo xtask fakes serve`): it passes once the host serves the fake's
    # repository on GitHub tokens from the console alone. `source` runs both steps at once and builds the Runner on the
    # host, as a cloud VM's startup script does; `binary` runs `install` with a build of it and settings, again to see
    # it change nothing, and then `enroll`, as hosts kept as code do. A GitHub-hosted runner: this repository is
    # public, so its minutes are free, and the setup needs a host nobody set up before.
    name: A fresh host enrols and serves (${{ matrix.how }})
    strategy:
      fail-fast: false
      matrix:
        how: [source, binary]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.how }}
      - name: The fakes
        run: |
          cargo build --locked -q -p xtask
          target/debug/xtask fakes serve --code-file "$RUNNER_TEMP/code" --urls-file "$RUNNER_TEMP/urls" \
            --timeout-s 3000 > "$RUNNER_TEMP/fakes.log" 2>&1 &
          echo "FAKES_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do [ -s "$RUNNER_TEMP/urls" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/urls" >> "$GITHUB_ENV"
      # The Runner's user cannot read this runner's home, so it clones from a copy of the checkout it can.
      - name: A copy of the checkout the Runner's user reads
        if: matrix.how == 'source'
        run: |
          git update-ref refs/heads/under-test HEAD
          git clone -q --bare . /tmp/runner.git
          chmod -R a+rX /tmp/runner.git
      - name: The Runner, built here
        if: matrix.how == 'binary'
        run: |
          cargo xtask build
          sudo install -m 755 target/release/codefusion-runner /tmp/codefusion-runner
          echo "SHA256=$(sha256sum /tmp/codefusion-runner | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo '{"ci_memory_gb": 6, "ci_cpus": 4}' > /tmp/settings.json
      - name: The newest image of this architecture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=$(gh release list -R "$GITHUB_REPOSITORY" --limit 50 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft | not) | .tagName | select(startswith("amd64-image-"))][0]')
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Set up the host
        env:
          # Its image's release is read through GitHub's API, whose rate limit for a GitHub-hosted runner's address
          # without a token is often spent.
          GITHUB_TOKEN: ${{ github.token }}
          HOW: ${{ matrix.how }}
        run: |
          set -euo pipefail
          # GitHub's image sets XDG_CONFIG_HOME to its own user's folder in /etc/environment, and pam_env gives it to
          # every user's systemd, so the Runner's user would read its units from a folder it cannot write.
          grep -n XDG_ /etc/environment || true
          sudo sed -i '/^XDG_CONFIG_HOME=/d' /etc/environment
          # The script takes a code only from a file of root's alone.
          sudo install -m 600 -o root -g root "$RUNNER_TEMP/code" /root/code
          setup() { sudo --preserve-env=GITHUB_TOKEN scripts/host-setup.sh "$@"; }
          host=(--machine ci-fresh --console "$CONSOLE" --image "$IMAGE" --github-api "$GITHUB")
          if [ "$HOW" = source ]; then
            setup "${host[@]}" --code-file /root/code --repo /tmp/runner.git
            exit 0
          fi
          brought=(--binary /tmp/codefusion-runner --sha256 "$SHA256" --settings /tmp/settings.json)
          setup install "${host[@]}" "${brought[@]}" | tee "$RUNNER_TEMP/first"
          test "$(tail -n 1 "$RUNNER_TEMP/first")" = "host-setup: changed"
          config=/home/codefusion-runner/.config/codefusion-runner/config.json
          sudo jq -e '.ci_memory_gb == 6 and .ci_cpus == 4 and (has("build_folder") | not)' "$config"
          setup install "${host[@]}" "${brought[@]}" | tee "$RUNNER_TEMP/again"
          test "$(tail -n 1 "$RUNNER_TEMP/again")" = "host-setup: unchanged"
          # A dry run says what it would change and changes nothing.
          echo '{"ci_memory_gb": 6}' > /tmp/fewer.json
          before=$(sudo sha256sum "$config")
          setup install "${host[@]}" --binary /tmp/codefusion-runner --sha256 "$SHA256" --settings /tmp/fewer.json \
            --dry-run | tee "$RUNNER_TEMP/dry"
          grep -q '^-  "ci_cpus": 4' "$RUNNER_TEMP/dry"
          test "$(tail -n 1 "$RUNNER_TEMP/dry")" = "host-setup: changed"
          test "$(sudo sha256sum "$config")" = "$before"
          setup enroll --code-file /root/code
      - name: A run again changes nothing
        env:
          HOW: ${{ matrix.how }}
        run: |
          set -euo pipefail
          if [ "$HOW" = source ]; then
            sudo scripts/host-setup.sh --machine ci-fresh --console "$CONSOLE" --code-file "$RUNNER_TEMP/none"
          else
            sudo scripts/host-setup.sh enroll --code-file "$RUNNER_TEMP/none"
            sudo scripts/host-setup.sh install --machine ci-fresh --console "$CONSOLE" --github-api "$GITHUB" \
              --binary /tmp/codefusion-runner --sha256 "$SHA256" --settings /tmp/settings.json | tee "$RUNNER_TEMP/last"
            test "$(tail -n 1 "$RUNNER_TEMP/last")" = "host-setup: unchanged"
          fi
      - name: The host serves
        timeout-minutes: 15
        run: |
          while kill -0 "$FAKES_PID" 2>/dev/null; do sleep 2; done
          cat "$RUNNER_TEMP/fakes.log"
          grep -q 'serves org/app' "$RUNNER_TEMP/fakes.log"
      - name: What the Runner said
        if: failure()
        run: |
          sudo tail -n 100 /home/codefusion-runner/.local/state/codefusion-runner/logs/runner.log || true
          sudo tail -n 50 /home/codefusion-runner/.local/state/codefusion-runner/logs/systemd.log || true
          cat "$RUNNER_TEMP/fakes.log" || true

  deny:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
