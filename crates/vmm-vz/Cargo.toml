[package]
name = "cf-vmm-vz"
description = "The virtual machine monitor on Apple's Virtualization.framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cf-vmm = { path = "../vmm" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
libc.workspace = true
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSError", "NSArray"] }
objc2-virtualization = "0.3"

[lints]
workspace = true
