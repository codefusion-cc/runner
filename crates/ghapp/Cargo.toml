[package]
name = "cf-ghapp"
description = "The GitHub App client: installation tokens and the registration of Actions runners. Filled in M3."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
bytes = "1"
cf-secret = { path = "../secret" }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
rand = "0.9"
thiserror.workspace = true
time = { version = "0.3", features = ["formatting", "parsing", "serde-well-known"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
cf-fake-github = { path = "../fake-github" }
tempfile.workspace = true
proptest.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
