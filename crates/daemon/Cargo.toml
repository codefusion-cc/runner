[package]
name = "cf-daemon"
description = "The daemon's GitHub half: scale sets per repository and size, and the scaler that ties a claimed job to a slot."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cf-budget = { path = "../budget" }
cf-guest-proto = { path = "../guest-proto" }
cf-host-macos = { path = "../host-macos" }
cf-lifecycle = { path = "../lifecycle" }
cf-vmhost = { path = "../vmhost" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
cf-ghapp = { path = "../ghapp" }
cf-scaleset = { path = "../scaleset" }
cf-secret = { path = "../secret" }
cf-workflows = { path = "../workflows" }
rand = "0.9"
sha2.workspace = true
thiserror.workspace = true
time = "0.3"
tracing = "0.1"

[dev-dependencies]
cf-fake-github = { path = "../fake-github" }
proptest.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
