[package]
name = "cf-daemon"
description = "The daemon's GitHub half: scale sets per repository and size, and the scaler that ties a claimed job to a slot."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cf-budget = { path = "../budget" }
cf-guest-proto = { path = "../guest-proto" }
cf-lifecycle = { path = "../lifecycle" }
cf-vmhost = { path = "../vmhost" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
cf-console-client = { path = "../console-client" }
cf-ghapp = { path = "../ghapp" }
cf-scaleset = { path = "../scaleset" }
cf-secret = { path = "../secret" }
cf-trusted = { path = "../trusted" }
cf-workflows = { path = "../workflows" }
rand = "0.9"
sha2.workspace = true
thiserror.workspace = true
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
cf-host-macos = { path = "../host-macos" }

[target.'cfg(target_os = "linux")'.dependencies]
cf-host-linux = { path = "../host-linux" }

[dev-dependencies]
cf-fake-console = { path = "../fake-console" }
cf-fake-github = { path = "../fake-github" }
cf-harness = { path = "../harness" }
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
cf-vmm-ch = { path = "../vmm-ch" }

# A stand-in vm-host is this test's own program, started with the vm-host's arguments, which a harness would not take.
[[test]]
name = "scopes"
harness = false

[lints]
workspace = true
