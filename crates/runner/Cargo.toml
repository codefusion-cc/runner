[package]
name = "codefusion-runner"
description = "The CodeFusion Runner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "codefusion-runner"
path = "src/main.rs"

[dependencies]
cf-image = { path = "../image" }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
cf-budget = { path = "../budget" }
cf-fake-github = { path = "../fake-github" }
cf-console-client = { path = "../console-client" }
cf-daemon = { path = "../daemon" }
cf-ghapp = { path = "../ghapp" }
cf-guest-proto = { path = "../guest-proto" }
cf-scaleset = { path = "../scaleset" }
cf-secret = { path = "../secret" }
cf-trusted = { path = "../trusted" }
cf-vmhost = { path = "../vmhost" }
cf-vmm = { path = "../vmm" }
cf-workflows = { path = "../workflows" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
cf-vmm-vz = { path = "../vmm-vz" }

[target.'cfg(target_os = "linux")'.dependencies]
cf-host-linux = { path = "../host-linux" }
cf-vmm-ch = { path = "../vmm-ch" }

[dev-dependencies]
cf-budget = { path = "../budget" }
cf-fake-github = { path = "../fake-github" }
ed25519-dalek.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
cf-host-macos = { path = "../host-macos" }

[lints]
workspace = true
