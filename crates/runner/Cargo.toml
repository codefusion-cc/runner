[package]
name = "codefusion-runner"
description = "The CodeFusion Runner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "codefusion-runner"
path = "src/main.rs"

[dependencies]
cf-image = { path = "../image" }

[target.'cfg(target_os = "macos")'.dependencies]
cf-budget = { path = "../budget" }
cf-console-client = { path = "../console-client" }
cf-daemon = { path = "../daemon" }
cf-ghapp = { path = "../ghapp" }
cf-host-macos = { path = "../host-macos" }
cf-scaleset = { path = "../scaleset" }
cf-secret = { path = "../secret" }
serde.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing = "0.1"
cf-guest-proto = { path = "../guest-proto" }
cf-vmhost = { path = "../vmhost" }
cf-vmm = { path = "../vmm" }
cf-vmm-vz = { path = "../vmm-vz" }
libc.workspace = true
serde_json.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
tempfile.workspace = true

[lints]
workspace = true
