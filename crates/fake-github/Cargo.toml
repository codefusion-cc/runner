[package]
name = "cf-fake-github"
description = "A fake GitHub at the HTTP edge for tests: App tokens, repositories, workflows and the Actions scale set service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
cf-secret = { path = "../secret" }
ring = "0.17"
rsa = { version = "0.9", features = ["std"] }
serde.workspace = true
serde_json.workspace = true
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
